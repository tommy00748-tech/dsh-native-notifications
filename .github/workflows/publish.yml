name: publish

# Tag a release (`git tag v1.0.0 && git push --tags`) to publish the package.
# Requires an npm automation token in the repository secret NPM_TOKEN.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Repository gate
        run: node scripts/check.mjs
      # A release tag is safe to push before the npm token exists: without the
      # secret the publish step is skipped instead of failing the run.
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance

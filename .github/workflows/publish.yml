name: publish

# Tag a release (`git tag v1.0.0 && git push --tags`) to publish the package.
# Requires an npm automation token in the repository secret NPM_TOKEN.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Repository gate
        run: node scripts/check.mjs
      # A release tag is safe to push before the npm token exists: without the
      # secret the publish step is skipped instead of failing the run.
      - name: Detect npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured; skipping the publish step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
